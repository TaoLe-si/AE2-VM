plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = mod_group_id
version = mod_version

// blockedMode: 'crash'(默认) → 检测到该作者 mod 游戏闪退；'warn' → 只警告不闪退
// 每次编译出两个版本：ae2vm-<ver>.jar（crash / 针对检测）+ ae2vm-nodetect-<ver>.jar（warn / 无针对检测）
def blockedMode = providers.gradleProperty('blockedMode').getOrElse('crash')
def modArchiveName = blockedMode == 'warn' ? 'ae2vm-nodetect' : mod_id

base {
    archivesName = modArchiveName
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
    withSourcesJar()
}

neoForge {
    version = neoforge_version

    mods {
        ae2vm {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        server {
            server()
        }
    }
}

dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "io.github.llamalad7:mixinextras-neoforge:0.5.3"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8' // prevent non-ASCII corruption on Windows (GBK default)
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            minecraft_version      : minecraft_version,
            neoforge_version_range : neoforge_version_range,
            ae2_version_range      : ae2_version_range
    ]
    inputs.properties replaceProperties
    inputs.property('blockedMode', blockedMode)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }

    // 把 blockedMode(crash/warn) 展开进 ae2vm/blockedmode.txt，打包进 jar，运行时可读
    filesMatching('ae2vm/blockedmode.txt') {
        expand([blockedMode: blockedMode])
    }
}

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += [
        '-Amixin.refmap=ae2vm.refmap.json'
    ]
}

// Auto-copy compiled JAR to Minecraft mods folder after build
// Remove all old versions of this mod before copying the new one
// 只删当前变体的旧 jar，保留另一个变体（crash 变体不会误删 nodetect 变体）
// 属性在 doLast 外捕获成局部变量（doLast 里拿不到配置期的 mod_version/modArchiveName 值）
tasks.register('cleanOldJars') {
    def modsDir = java.nio.file.Path.of('E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods')
    // crash 变体(ae2vm) → ae2vm-<数字>.jar；warn 变体(ae2vm-nodetect) → ae2vm-nodetect-*.jar
    def glob = modArchiveName == 'ae2vm' ? 'ae2vm-[0-9]*.jar' : "${modArchiveName}-*.jar"
    doLast {
        java.nio.file.Files.newDirectoryStream(modsDir, glob).withCloseable { stream ->
            stream.each { java.nio.file.Files.deleteIfExists(it) }
        }
    }
}

tasks.register('copyJarToMods', Copy) {
    dependsOn tasks.named('jar')
    dependsOn 'cleanOldJars'
    from tasks.named('jar').flatMap { it.archiveFile }
    into 'E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods'
    doLast {
        logger.lifecycle("Copied JAR to mods folder")
    }
}

// Hook into the build lifecycle: build → copyJarToMods
tasks.named('build') {
    finalizedBy 'copyJarToMods'
}
