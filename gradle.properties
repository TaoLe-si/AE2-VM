# AE2 VM Addon — 1.7.10 / GTNH New Horizons 2.8.4 专用线（分支 1.7.10-gtnh）
# 构建 = GTNH 的 RetroFuturaGradle（gtnhconvention 2.0.27）+ Gradle 9.3.1 + JDK 25 跑构建，
#         产物是 Java 8 字节码（AE2 rv3-GTNH 的 class major = 52，实测）。
# 配方照抄 E:\Probability-Pattern\1.7.10（同机已跑通），不要自己试 ForgeGradle 1.2/2.x。
# ⚠ 1.7.10 的运行时是 GTNH 的 Forge-LWJGL3 + UniMixins（实例里有 +unimixins-all-1.7.10-0.1.23.jar），
#   所以 mixin 由 UniMixins 提供，**不像 1.10.2/AoE 那样要自己内嵌 mixin**。

modName = AE2 VM

modId = ae2vm

modGroup = com.ae2vm.addon

# 版本号：13 个 fork 统一 1.14.1（用户决定，不升版）。
# ⚠ gtnhgradle 会用 `git describe` 推实际 version（他那份产物叫
#   statpatterns-<sha>-1-7-10+<sha>-dirty.jar），所以真正的产物版本在 build.gradle.kts 里显式覆盖。
modVersion = 1.14.1

useModGroupForPublishing = true

autoUpdateBuildScript = false

minecraftVersion = 1.7.10

forgeVersion = 10.13.4.1614

# 1.7.10 的映射是 MCP stable_12（本机已缓存 de/oceanlabs/mcp/mcp_stable/12 + RFG 的 fernflower 缓存）
channel = stable
mappingsVersion = 12

developmentEnvironmentUserName = Developer

# Java 8 only：与 AE2 rv3 同代，最稳（Probability-Pattern 的注释原话：matches AE2 rv3, safest for this port）
enableModernJavaSyntax = false

# ---- UniMixins（gtnhgradle 的 MixinModule）----
# 会自动生成/注册 mixin 配置并挂上注解处理器；配置名按 modId 派生 → mixins.ae2vm.json
usesMixins = true
# @Mixin 类所在子包（相对 modGroup）→ com.ae2vm.addon.mixin
mixinsPackage = mixin

# ⚠ 关掉 gtnhgradle 的 spotless 风格检查：本项目的引擎源码在 13 个 fork 之间是逐字节同构的
#   （跨版本 diff 只有在这个前提下才有意义），而 spotless 会按 GTNH 的 import 排序规则重排我们
#   全部文件。Probability-Pattern 那种单仓项目开它是好事，这里不合适。
#   要恢复风格一致性的正确做法：在**所有** fork 上一起跑 spotlessApply，不是只动这一个。
disableSpotless = true

# gtnhgradle 2.0.x 需要 JVM 25 跑构建
org.gradle.java.home=D:/Java25/jdk-25.0.4

# 目标实例（GTNH 2.8.4，PrismLauncher）。⚠ 本仓**没有**接自动部署：往实机 mods 里放 jar 要先跟用户确认。
mods_folder=C:/Users/Administrator/AppData/Roaming/PrismLauncher/instances/GT_New_Horizons_2.8.4_Java_17-25 (1)/.minecraft/mods
