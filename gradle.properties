# 使用 D:\Java21 作为构建 JDK（编译目标 Java 17，兼容 MC 1.20.1 / Forge 47）

org.gradle.java.home=D:\\Java21

org.gradle.parallel=false

org.gradle.warning.mode=all



mod_id=ae2vm

mod_name=AE2 VM

mod_version=1.12.43

mod_group_id=com.ae2vm.addon



minecraft_version=1.20.1

forge_version=47.4.22

forge_version_range=[47,)

ae2_version=15.4.10

ae2_version_range=[15,)



# Cloth Config API（可选依赖，提供 config/ae2vm.json 配置开关）

cloth_config_version=11.1.136



# 编译后 jar 自动复制到的 mods 文件夹（用户 1.20.1 Forge 实例）

mods_folder=E:/MC/.minecraft/versions/1.20.1-Forge_47.4.22/mods



# 代理（下载依赖必需，Gradle 走 7890 代理）

systemProp.http.proxyHost=127.0.0.1

systemProp.http.proxyPort=7890

systemProp.https.proxyHost=127.0.0.1

systemProp.https.proxyPort=7890


# ForgeGradle 证书校验（走代理时 MITM 会失败）→ 关闭
systemProp.net.minecraftforge.gradle.check.certs=false
