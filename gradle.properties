# AE2 VM Addon — 1.16.1 fork (AE2 v8.0.0 + Forge 32.0.108 + ForgeGradle 5.1.69 + Gradle 7.6.4 + Java 8 daemon / Java 8 bytecode + official mappings)
# Gradle 7.6.4 用 Java 8 跑 daemon；mod bytecode 也是 Java 8（MC 1.16.1 runtime = jre-legacy / Java 8）

org.gradle.java.home=C:/Users/Administrator/AppData/Local/jdks/jdk-8

org.gradle.parallel=false

org.gradle.warning.mode=all



mod_id=ae2vm

mod_name=AE2 VM

mod_version=1.14.1

mod_group_id=com.ae2vm.addon



#########################################################
# Minecraft Versions                                    #
# 写法照抄 AE2 官方 8.0.x-1.16.1 分支：                  #
#   minecraft_release = 系列号（1.16）                   #
#   minecraft_version = 实际编译目标（1.16.1）           #
# 8.0.0 的 jar 内 mods.toml 把 minecraft 钉成 "[1.16.1]" #
# （不像 8.2.x/8.4.x 那样给半开区间），这里跟着钉死。    #
#########################################################
minecraft_release=1.16

minecraft_version=1.16.1

minecraft_version_range=[1.16.1]

# Forge 32.0.108 = AE2 8.0.x-1.16.1 官方 forge_version，
# 也与用户实机实例 1.16.1-Forge_32.0.108 完全一致（1.16.5 的错位教训：编译目标要跟实机 build 对上）
forge_version=32.0.108

forge_version_range=[32.0.108,33.0.0)

# AE2 v8.0.0 forge 1.16.1（appliedenergistics2-8.0.0.jar，jar 内 Implementation-Version: 8.0.0）
ae2_version=8.0.0

# v8 modId="appliedenergistics2"（v8/v9/v10 都未改名；v11+ 才改叫 "ae2"）
ae2_version_range=[8.0.0,9)

#########################################################
# Mappings（build.gradle 的 mappings channel/version 读这两个属性）
#   沿用 1.16.5 / 1.16.4 的结论：MCP snapshot 编译期出 SRG 方法名
#   （ItemStack.isEmpty() -> func_190926_b），MC API 全部找不到符号；
#   改用 official（Mojang 名），reobfJar 再重混淆回 SRG。
#   piston-meta 实测 1.16.1 有 client_mappings（sha1 ddf517a4f6750f4c15189de4e03246ae1f916cf5）。
# AE2 官方 8.0.x 用的是 snapshot / 20200723-1.16.1；我们保持 official。
#########################################################
mcp_channel=official
mcp_mappings=1.16.1




# 编译后 jar 自动复制到的 mods 文件夹（用户实机 1.16.1-Forge_32.0.108 实例，AE2 8.0.0 已在内）
mods_folder=E:/MC/.minecraft/versions/1.16.1-Forge_32.0.108/mods

# 用户关代理换国内源——不再走 7890 代理；如需回滚加上面的 systemProp.* proxy 行
# ForgeGradle 证书校验：直连也建议关闭（一些 CDN 偶尔会带链证书导致校验不过）
systemProp.net.minecraftforge.gradle.check.certs=false
