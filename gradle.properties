# AE2 VM — Minecraft 1.10.2
org.gradle.jvmargs=-Xmx2G -XX:MaxPermSize=256m
# NOTE: 1.10.2 requires a Java 8 JDK. Point this at your JDK 8 install.
org.gradle.java.home=C:/Users/Administrator/AppData/Local/jdks/jdk-8

# Project identity (mirrors the 1.20.1 / 1.21.1 build)
mod_id=ae2vm
mod_name=AE2 VM
mod_group_id=com.ae2vm.addon

# Version — kept in lock-step with the 1.20.1 / 1.21.1 branches.
mod_version=1.10.9

# Minecraft / Forge / AE2 matrix for MC 1.10.2
minecraft_version=1.10.2
forge_version=12.18.3.2422
forge_version_range=[12.18,)
mcp_mappings=stable_29
ae2_version=rv4-stable-1
ae2_version_range=[rv4,)

# Optional proxy (mirrors the other branches; edit if your network differs)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890

# Mods folder for copyJarToMods (1.10.2 Forge instance)
mods_folder=E:/MC/.minecraft/versions/1.10.2-Forge_12.18.3.2422/mods
