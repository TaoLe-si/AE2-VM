# AE2 VM Addon — 1.16.1 fork (AE2 v8.0.0 + Forge 36.0.x + ForgeGradle 3.x + Gradle 5.6.4 + Java 8 daemon / Java 8 bytecode + MCP mappings)
# Gradle 5.6.4 用 Java 8 跑 daemon（Gradle 5.x 时代 Java 17 不支持）；mod bytecode 也是 Java 8（MC 1.16.1 runtime）

org.gradle.java.home=C:/Users/Administrator/AppData/Local/jdks/jdk-8

org.gradle.parallel=false

org.gradle.warning.mode=all



mod_id=ae2vm

mod_name=AE2 VM

mod_version=1.15.0-alpha.1

mod_group_id=com.ae2vm.addon



#########################################################
# Minecraft Versions                                    #
# 1.16.1 fork — AE2 官方首个 1.16.x mod（2020-10-31）    #
#   minecraft_release = 系列号（1.16）                   #
#   minecraft_version = 实际编译目标（1.16.1）           #
#   *_range           = 半开区间 [x,y)                   #
#########################################################
minecraft_release=1.16

minecraft_version=1.16.1

minecraft_version_range=[1.16.1,1.16.5)

# Forge 1.16 早期主线（1.16.1 时代 Forge 是 36.0.x；与 1.16.5 的 36.2.x 区别显著）
# 1.16.1 ↔ 36.0.x 是官方对应关系（参考 AE2 8.0.0 时代 Forge 推荐版本）
forge_version=36.0.14

forge_version_range=[36.0.0,36.1.0)

# AE2 v8.0.0 forge 1.16.1（CurseForge appliedenergistics2-8.0.0.jar，2020-10-31）
ae2_version=8.0.0

# 1.16.1 时代的 AE2 上游就是 8.0.0 一个版本（8.1.x/8.2.x 是给 1.16.4 用的）
ae2_version_range=[8.0.0,8.1.0)

#########################################################
# Mappings（build.gradle 的 mappings channel/version 读这两个属性）
#   1.16.1 时代 AE2 官方用 MCP stable_31（FG3 stable mappings）
#   而 1.16.5 时代是 stable_36（FG5 stable mappings）
# ⚠️ FG3 → FG5 之间的 MCP mappings 命名空间差异极大（很多类被拆分/重命名），
#   shim 层需要重新适配 AE2 8.0.0 API
#########################################################
mcp_channel=stable
mcp_mappings=31



# 编译后 jar 自动复制到的 mods 文件夹（用户实机 1.16.1 Forge_36.0.x 实例）
# 注意：1.16.1 的 PCL 实例目录还不存在，需要用户先建
mods_folder=E:/MC/.minecraft/versions/1.16.1-Forge_36.0.14/mods

# 用户关代理换国内源——不再走 7890 代理；如需回滚加上面的 systemProp.* proxy 行
# ForgeGradle 证书校验：直连也建议关闭（一些 CDN 偶尔会带链证书导致校验不过）
systemProp.net.minecraftforge.gradle.check.certs=false