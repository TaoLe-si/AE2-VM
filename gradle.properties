# AE2 VM Addon — 1.16.4 fork (AE2 v8.2.0 + Forge 35.1.37 + ForgeGradle 5.1.69 + Gradle 7.6.4 + Java 8 daemon / Java 8 bytecode + official mappings)
# Gradle 7.6.4 用 Java 8 跑 daemon；mod bytecode 也是 Java 8（MC 1.16.4 runtime 仍是 jre-legacy / Java 8）

org.gradle.java.home=C:/Users/Administrator/AppData/Local/jdks/jdk-8

org.gradle.parallel=false

org.gradle.warning.mode=all



mod_id=ae2vm

mod_name=AE2 VM

mod_version=1.14.2

mod_group_id=com.ae2vm.addon



#########################################################
# Minecraft Versions                                    #
# 写法照抄 AE2 官方 8.2.x-1.16.x 分支：                  #
#   minecraft_release = 系列号（1.16）                   #
#   minecraft_version = 实际编译目标（1.16.4）           #
#   *_range           = 半开区间 [x,y)                   #
# 8.2.x 一个分支覆盖 1.16.2~1.16.4，故区间下限是 1.16.2   #
#########################################################
minecraft_release=1.16

minecraft_version=1.16.4

minecraft_version_range=[1.16.2,1.17.0)

# Forge 1.16.4 主线（35.x 系列）
# forge_version = 编译目标 = 用户实机实例的精确 build（1.16.5 的教训：别跟实例错位）
# forge_version_range = 照抄 AE2 8.2.x-1.16.x 官方声明
forge_version=35.1.37

forge_version_range=[35.1.4,36.0.0)

# AE2 v8.2.0 forge 1.16.4（GitHub release appliedenergistics2-8.2.0.jar）
ae2_version=8.2.0

# v8 modId="appliedenergistics2"（v8/v9/v10 都未改名；v11+ 才改叫 "ae2"）
ae2_version_range=[8.2.0,9)

#########################################################
# Mappings（build.gradle 的 mappings channel/version 读这两个属性）
#   1.16.4 同 1.16.5：MCP snapshot 编译期出 SRG 方法名（ItemStack.isEmpty() -> func_190926_b），
#   MC API 全部找不到符号；改用 official（Mojang 名），reobfJar 再重混淆回 SRG。
#   piston-meta 实测 1.16.4 有 client_mappings（sha1 0837de813d1a6b67e23da3c520a84e872c8d2f0e），runtime 仍是 Java 8。
# ⚠️ AE2 官方 8.2.x 用的是 snapshot / 20201028-1.16.3；我们保持 official，只把写法统一成属性驱动。
#########################################################
mcp_channel=official
mcp_mappings=1.16.4




# 编译后 jar 自动复制到的 mods 文件夹（用户实机 1.16.4-Forge_35.1.37 实例，AE2 8.2.0 已在内）
mods_folder=E:/MC/.minecraft/versions/1.16.4-Forge_35.1.37/mods

# 用户关代理换国内源——不再走 7890 代理；如需回滚加上面的 systemProp.* proxy 行
# ForgeGradle 证书校验：直连也建议关闭（一些 CDN 偶尔会带链证书导致校验不过）
systemProp.net.minecraftforge.gradle.check.certs=false
