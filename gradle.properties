# AE2 VM Addon — 1.15.2 fork (AE2 v7.0.5 + Forge 31.2.62 + ForgeGradle 3.0.197 + Gradle 5.6.4 + Java 8)
# 1.15.2 时代工具链：FG3 没有 official（mojmap）通道，只能用 AE2 官方 7.x-1.15 的 MCP snapshot。
# Gradle 5.6.4 用 JDK 8 跑 daemon；产物也是 Java 8（MC 1.15.2 runtime = Java 8）。

org.gradle.java.home=C:/Users/Administrator/AppData/Local/jdks/jdk-8

org.gradle.parallel=false

org.gradle.warning.mode=all



mod_id=ae2vm

mod_name=AE2 VM

mod_version=1.14.2

mod_group_id=com.ae2vm.addon



#########################################################
# Minecraft Versions                                    #
# 写法照抄 AE2 官方 7.x-1.15 分支：                      #
#   minecraft_release = 系列号（1.15）                   #
#   minecraft_version = 实际编译目标（1.15.2）           #
# AE2 7.0.5 jar 内 mods.toml：forge=[31.2.31,32.0.0)、   #
# minecraft=[1.15.2]（钉死单版本）、loaderVersion=[31,)  #
# forge_version 用实机实例的精确 build 31.2.62           #
# （1.16.5 的教训：编译目标别跟实机错位）                #
#########################################################
minecraft_release=1.15

minecraft_version=1.15.2

minecraft_version_range=[1.15.2]

forge_version=31.2.62

forge_version_range=[31.2.31,32.0.0)

# AE2 v7.0.5 forge 1.15.2（用户实机实例 mods 里那份；GitHub release 无附件，CurseForge 独占）
ae2_version=7.0.5

# v7/v8 modId="appliedenergistics2"（v11+ 才改叫 "ae2"）
ae2_version_range=[7.0.5,8)

#########################################################
# Mappings
#   ⚠️ 1.15.2 与 1.16.x 的关键区别：ForgeGradle 3.0 没有 official 通道，
#   只能按 AE2 官方 7.x-1.15 的写法用 MCP snapshot。
#   FG3 会反编译出带 MCP 名的 MC 源码，所以 isEmpty()/getCount() 这类能直接编过；
#   但少数 MC 类名与 mojmap 不同（1.15.2 是 NBTTagCompound，不是 CompoundNBT）。
#########################################################
mcp_channel=snapshot
mcp_mappings=20200715-1.15.1

#########################################################
# Mixin 引导（本版本与 1.16.x 最大的差异，别再走回头路）
#   Forge 31.x（1.15.2）**没有**原生 mixin 支持（mods.toml 的 [[mixins]] 是 1.16.1 才有的），
#   AE2 7.x 自己也不用 mixin，1.15.2 也没有 coremod API
#   （net.minecraftforge.fml.relauncher 整个包不存在）。
#   但 mixin 0.8.2 本身在实例的启动器类路径上，它自带的 services 声明
#   （MixinTransformationService + MixinLaunchPlugin）会被 modlauncher 自动发现并初始化，
#   所以**什么都不用引导**，只差把 ae2vm.mixins.json 注册进去 ——
#   由 AE2VMAddon 的构造函数在 mod 加载期做（见 build.gradle 顶部说明）。
#   ⚠️ 不要再自带 ITransformationService：Forge 1.15.2 的 ModDirTransformerDiscoverer
#   会把这个 jar 从 mod 加载里排除掉（allExcluded），mod 就再也不构造了。
#########################################################



# 编译后 jar 自动复制到的 mods 文件夹（用户实机 1.15.2-Forge_31.2.62 实例，AE2 7.0.5 已在内）
mods_folder=E:/MC/.minecraft/versions/1.15.2-Forge_31.2.62/mods

# 用户关代理换国内源——不走 7890 代理
# ForgeGradle 证书校验：直连也建议关闭（一些 CDN 偶尔会带链证书导致校验不过）
systemProp.net.minecraftforge.gradle.check.certs=false
