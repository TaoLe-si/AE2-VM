# 使用 D:\Java21 作为构建 JDK（编译目标 Java 17，兼容 MC 1.19.3 / Forge 44）

org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.20.8-hotspot

org.gradle.parallel=false

org.gradle.warning.mode=all



mod_id=ae2vm

mod_name=AE2 VM

mod_version=1.14.1

mod_group_id=com.ae2vm.addon



minecraft_version=1.18.2

forge_version=40.3.12

forge_version_range=[40,41)

ae2_version=11.7.4

ae2_version_range=[11,12)




# 编译后 jar 自动复制到的 mods 文件夹（用户实机 1.18.2 Forge_40.3.12 实例）
mods_folder=E:/MC/.minecraft/versions/1.18.2-Forge_40.3.12/mods



# 代理（下载依赖必需，Gradle 走 7890 代理）

systemProp.http.proxyHost=127.0.0.1

systemProp.http.proxyPort=7890

systemProp.https.proxyHost=127.0.0.1

systemProp.https.proxyPort=7890


# ForgeGradle 证书校验（走代理时 MITM 会失败）→ 关闭
systemProp.net.minecraftforge.gradle.check.certs=false