# AE2 VM Addon — 1.16.5 fork (AE2 v8.4.7 + Forge 36.2.34 + ForgeGradle 5.1.69 + Gradle 5.6.4 + Java 8 daemon / Java 8 bytecode + MCP mappings)
# Gradle 5.6.4 用 Java 8 跑 daemon（Gradle 5.x 时代 Java 17 不支持）；mod bytecode 也是 Java 8（MC 1.16.5 runtime）

org.gradle.java.home=C:/Users/Administrator/AppData/Local/jdks/jdk-8

org.gradle.parallel=false

org.gradle.warning.mode=all



mod_id=ae2vm

mod_name=AE2 VM

mod_version=1.14.1

mod_group_id=com.ae2vm.addon



#########################################################
# Minecraft Versions                                    #
# 写法照抄 AE2 官方 8.4.x-1.16.x 分支：                  #
#   一个分支覆盖整个 1.16 系列，而不是每个补丁版一个分支  #
#   minecraft_release = 系列号（1.16）                   #
#   minecraft_version = 实际编译目标（1.16.5）           #
#   *_range           = 半开区间 [x,y)                   #
#########################################################
minecraft_release=1.16

minecraft_version=1.16.5

minecraft_version_range=[1.16.5,1.17.0)

# Forge 1.16 主线（36.x 系列；与 AE2 8.4.x-1.16.x 声明完全一致）
forge_version=36.2.34

forge_version_range=[36.1.10,37.0.0)

# AE2 v8.4.7 forge 1.16.5（GitHub release appliedenergistics2-8.4.7.jar）
ae2_version=8.4.7

# v8.4.7 modId="appliedenergistics2"（v8/v9/v10 都未改名；v11+ 才改叫 "ae2"）
ae2_version_range=[8.4.7,9)

#########################################################
# Mappings（build.gradle 的 mappings channel/version 读这两个属性）
#   1.16.5 用 MCP stable_36 编译期会出 SRG 方法名（ItemStack.isEmpty() -> func_190926_b），
#   MC API 全部找不到符号；改用 official（Mojang 名），reobfJar 再重混淆回 SRG。
# ⚠️ AE2 官方用的是 snapshot / 20210309-1.16.5；我们保持 official，只把写法统一成属性驱动。
#########################################################
mcp_channel=official
mcp_mappings=1.16.5




# 编译后 jar 自动复制到的 mods 文件夹（用户实机 1.16.5 Forge_36.2.34 实例）
# ⚠️ PCL 实际启动的实例是 1.16.5-Forge_36.2.42（36.2.34 那个目录是废的，以前配错过一次，
#   结果游戏加载的还是旧 jar → mixin 报 CraftingServiceMixin not found 崩溃）
mods_folder=E:/MC/.minecraft/versions/1.16.5-Forge_36.2.42/mods

# 用户关代理换国内源——不再走 7890 代理；如需回滚加上面的 systemProp.* proxy 行
# ForgeGradle 证书校验：直连也建议关闭（一些 CDN 偶尔会带链证书导致校验不过）
systemProp.net.minecraftforge.gradle.check.certs=false
