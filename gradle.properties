# 使用 D:\Java21 作为构建 JDK（编译目标 Java 17，兼容 MC 1.19.3 / Forge 44）

org.gradle.java.home=D:\\Java21

org.gradle.parallel=false

org.gradle.warning.mode=all



mod_id=ae2vm

mod_name=AE2 VM

mod_version=1.14.1

mod_group_id=com.ae2vm.addon



minecraft_version=1.19.3

forge_version=44.1.0

forge_version_range=[44,)

ae2_version=13.0.10-beta

ae2_version_range=[13,15)




# 编译后 jar 自动复制到的 mods 文件夹（用户实机 1.19.3 Forge_44.1.23 实例 — 44.x 系列 ABI 兼容，forge_version=44.1.0 编译的 jar 仍可在此实例跑）
mods_folder=E:/MC/.minecraft/versions/1.19.3-Forge_44.1.23/mods



# 代理（下载依赖必需，Gradle 走 7890 代理）

systemProp.http.proxyHost=127.0.0.1

systemProp.http.proxyPort=7890

systemProp.https.proxyHost=127.0.0.1

systemProp.https.proxyPort=7890


# ForgeGradle 证书校验（走代理时 MITM 会失败）→ 关闭
systemProp.net.minecraftforge.gradle.check.certs=false