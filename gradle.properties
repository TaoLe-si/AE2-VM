# AE2 VM Addon — 1.10.2 fork（AE2 rv4-stable-1 + Forge 12.18.3.2422 + ForgeGradle 2.3-SNAPSHOT + Gradle 4.8 + Java 8）
# 代码基座 = **1.12.2-nova fork**（现代架构：AEKey/GenericStack/KeyCounter/IPatternDetails shim + 版本桥）。
# 构建脚手架沿用 rv 时代那套（FG2 + LaunchWrapper coremod + mixin 0.7.11 + mcmod.info）。
# ⚠ rv 时代工具链与 1.15.2+ 完全不同：**别套 FG3/modlauncher 的结论**
#   （没有 @Mod 注解构造、没有 ITransformationService、没有 official/mojmap 通道、没有 native mixin）。

# FG2 + Gradle 4.8 只能在 JDK 8 上跑（与 nova 同一个 JDK）
org.gradle.java.home=C:/Users/Administrator/AppData/Local/jdks/jdk-8

org.gradle.parallel=false

org.gradle.warning.mode=all



mod_id=ae2vm

mod_name=AE2 VM

mod_version=1.14.1

mod_group_id=com.ae2vm.addon

# 全量基准期望用例数：BenchRunner 用它卡『发现数 == 期望数』，防静默 0 测试。
# 口径来源：AE2VMAddon-1.12.2-nova 实测 33 类 / 230 用例
# （= 基座 1.20.1 的 31 类/221 + v8 专有 V8BridgeQuantityTest(7) + VmMissingAfterStockRefillTest(2)）。
# 逐类名册见 AE2-refs/BASELINE-TEST-ROSTER.md。桥接层跑通后若确有增删，改这个数并写明原因。
expected_tests=230



#########################################################
# Minecraft Versions                                    #
# AoE（Age of Engineering）实例实跑 Forge 12.18.3.2511，#
# 但本机 FG 缓存里只有 **12.18.3.2422** 有 userdev +     #
# stable_29 产物（2511 那版 libraries 里只有 universal    #
# jar，FG2 解析 userdev 分类件会 404）。两者同属 1.10.2  #
# 线，mcmod.info 的 forge 区间覆盖它。                   #
# 1.10.2 的 2511 与 2422 之间 API 无变化（同 minor）。    #
#########################################################
minecraft_release=1.10

minecraft_version=1.10.2

minecraft_version_range=[1.10.2]

forge_version=12.18.3.2422

forge_version_range=[12.18.2,)

# AE2 rv4-stable-1 = AoE 实例 mods 里那份（sha1 前缀 8a15aa919ec9c0ed）。
# modid 仍是 appliedenergistics2。
ae2_version=appliedenergistics2-rv4-stable-1

ae2_version_range=[rv4,)

#########################################################
# Mappings                                              #
#   FG2 只有 MCP 通道。1.10.2 用 stable 频道 29 号       #
#   （本机缓存 de/oceanlabs/mcp/mcp_stable/29/1.10.2/srgs #
#    下 mcp-notch / mcp-srg / notch-mcp / notch-srg /     #
#    mcp.exc 五件齐全）。                                 #
#   FG2 的写法是 <channel>_<version>，不是 snapshot_xxx。 #
#########################################################
mcp_channel=stable

mcp_mappings=stable_29

#########################################################
# Mixin 引导（rv 时代与 1.15+/1.16+ 最大的差别）          #
#   Forge 12.18 没有原生 mixin 支持，mixin 必须由          #
#   IFMLLoadingPlugin(coremod) + MixinTweaker 引导，      #
#   且运行时 mixin 库不是现成存在的 —— 见 build.gradle    #
#   里关于运行时可选性的说明。                             #
#########################################################



# 部署目标：用户实机 Age of Engineering 实例（AE2 rv4-stable-1 已在内）
mods_folder=E:/MC/.minecraft/versions/Age of Engineering/mods

# 用户关代理换国内源——不走 7890 代理
# ForgeGradle 证书校验：直连也建议关闭（一些 CDN 偶尔会带链证书导致校验不过）
systemProp.net.minecraftforge.gradle.check.certs=false
